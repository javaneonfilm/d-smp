##############################################
#   AntiGamingChair (Vulcan) for CartZone    #
##############################################
# Vulcan, renamed in every message players see. Cheating bans go through CartZone's
# /offence ladder ("offence %player% cheating ..."), so they count as Cheating offences
# (14d, 30d, perm), show up in /offence history and can be undone there.
#
# Thresholds (max-violations) are about a third of Vulcan's defaults: combat, packet and
# player checks ban fast. Movement checks that CartZone itself sets off (minecarts on powered
# rails, ghast drops and forced elytra gliding, TNT cart and wind charge launches, the lobby
# grapple) only alert staff: speed, flight, motion, elytra, entityspeed, entityflight, velocity,
# jump, strafe. Flip punishable: true on any of them once you've watched them stay quiet.
# Timer checks keep the fake timeout kick: lag sets them off, so they never ban.

# The prefix that will be used for all of the %prefix% messages throughout the plugin
prefix: '&4&lAntiGamingChair &8|'

alerts:
  format: '%prefix% &f%player% &7failed &f%check% %dev%&7(&fType %type%&7)%dev% &7[&4%vl%&7/&4%max-vl%&7]'
  hover-message:
    - '&7Ping: &c%ping% &8| &7TPS: &c%tps% &8| &7Version: &c%version% &8| &7Client: &c%client-brand%'
    - ''
    - '&7Description:'
    - '&7%description%'
    - ''
    - '&7Information:'
    - '&7%info%'
    - ''
    - '&7Click to teleport to &b%player%&7.'
  click-commands:
    - '/vulcan clickalert %player%'
  click-alert-command-commands:
    - 'tp %player%'
  toggled-on-message: '%prefix% &7Alerts &aon&7.'
  toggled-off-message: '%prefix% &7Alerts &coff&7.'
  print-to-console: true
  console-format: '[AntiGamingChair] %player% failed %check% %dev%(Type %type%)%dev% (%vl%/%max-vl%)'
  custom-commands: []
  severity:
    violations:
      2: 2
      3: 3
      4: 4
      5: 6
      6: 6
      7: 6
      8: 6
      9: 6
      10: 6
    colors:
      1: '&a'
      2: '&e'
      3: '&6'
      4: '&c'
      5: '&4'
      6: '&4'
      7: '&4'
      8: '&4'
      9: '&4'
      10: '&4'
  experimental-symbol: "*"

log-file:
  enabled: true
  alert-message: "%player% failed %check% %dev%(Type %type%)%dev% [VL: %vl%] [Ping: %ping%] [TPS: %tps%] [Version: %version%] [Client: %client-brand%]"
  punishment-message: "%player% was punished for %check% %dev%(Type %type%)%dev% [VL: %vl%] [Ping: %ping%] [TPS: %tps%] [Client: %client-brand%]"

unloaded-chunks:
  setback-enabled: false
  message: '%prefix% &c%player% &7was set back for being in an unloaded chunk.'
  max-ticks: 40

punishment-file:
  enabled: true

violation-reset:
  enabled: true
  interval-in-minutes: 8
  message-enabled: false
  message: '%prefix% &7Violations for everyone online were reset.'

client-brand-alerts:
  resolve: true
  enabled: true
  ignore-alerts-list:
    - 'vanilla'
  message: '%prefix% &c%player% &7joined on &f%client-brand%&7.'
  blocked-client-brands: []
  unallowed-client-brand-kick-message: '&cYou can''t join with %client-brand%.'
  console: false
  console-message: '[AntiGamingChair] %player% joined using %client-brand%'
  whitelist-enabled: false
  whitelisted-client-brands: []

connection:
  debug-messages: false
  ignore-ids-over-0: false
  other-anticheat-support: false
  invalid:
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for an invalid confirmation packet (ID: &c%id%&7)'
    console-alert-message: '[AntiGamingChair] &c%player% &7was kicked for an invalid confirmation packet (ID: &c%id%&7)'
  out-of-order:
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for an out of order confirmation packet (&7got &c%id% &7, expected &c%last-id%&7)'
    console-alert-message: '[AntiGamingChair] %player% was kicked for an out of order confirmation packet (got %id%, expected %last-id%)'
  no-response:
    delay-in-seconds: 30
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for not answering confirmation packets (&c%delay%&7ms)'
    console-alert-message: '[AntiGamingChair] %player% was kicked for not answering confirmation packets (%delay%ms)'
  max-size:
    amount: 2000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for too many pending confirmations (&c%size%&7)'
    console-alert-message: '[AntiGamingChair] %player% was kicked for too many pending confirmations (%size%)'
  keepalive:
    kick-enabled: true
    max-delay: 45000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for not answering KeepAlives (&c%delay%ms&7)'
    console-message: '[AntiGamingChair] %player% was kicked for not answering KeepAlives (%delay%ms)'
  max-ping:
    kick-enabled: true
    max-ping: 20000
    max-ticks: 20
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for very high ping (&c%ping%ms&7)'
    console-message: '[AntiGamingChair] %player% was kicked for very high ping (%ping%ms)'

punishments:
  message: '%prefix% &c%player% &7got banned for &f%check% &7(&fType %type%&7) &7[&4x%vl%&7]'
  broadcast:
    - "&8&m----------------------------------------"
    - "&4&lAntiGamingChair &7caught &c%player% &7cheating. They're gone."
    - "&8&m----------------------------------------"

judgement-days:
  started-broadcast:
    - "&8&m----------------------------------------"
    - "&4&lAntiGamingChair &7Judgement Day has started..."
    - "&8&m----------------------------------------"
  ended-broadcast:
    - "&8&m----------------------------------------"
    - "&7Judgement Day is over. &c%amount% &7players got banned."
    - "&8&m----------------------------------------"
  commands:
    - "offence %player% cheating AntiGamingChair Judgement Day"
  broadcast:
    - '&8&m----------------------------------------'
    - '&c%player% &7got banned by &4&lAntiGamingChair&7.'
    - '&8&m----------------------------------------'
  cooldown: 1000
  run-at-interval: false
  interval: 36000

freeze:
  logged-out-while-frozen-commands: []

ghost-blocks-fix:
  enabled: true
  ghost-water-fix: true
  minimum-tps: 18.5
  ignore-legacy-via: true
  buffer:
    max: 3
    decay: .1
  setback: true
  update-blocks: false
  ticks: 3
  message-enabled: false
  message: '&cYou were standing on a ghost block, it got fixed.'
  staff-message-enabled: false
  staff-message: '%prefix% &c%player%''s &7position was fixed for a ghost block (%world%, %x%, %y%, %z%) &7[%ticks%]'
  print-to-console: true
  console-message: '%player% position was fixed for a ghost block (%world%, %x%, %y%, %z%) [%ticks%]'

messages:
  no-permission: '&cYou can''t use that.'
  cant-execute-from-console: '&cThat doesn''t work from console.'
  ban-command-syntax: '%prefix% &7Usage: &c/vulcan ban (player)&7.'
  kb-command-syntax: '%prefix% &7Usage: &c/vulcan knockback (player) &8| &c/vulcan kb (player)&7.'
  profile-command-syntax: '%prefix% &7Usage: &c/vulcan profile (player)&7.'
  jday-command-syntax: '%prefix% &7Usage: &c/jday add (player) &8| &c/jday execute &8| &c/jday list &8| &c/jday remove (player)&7.'
  reload-success: '%prefix% &aReloaded.'
  invalid-target: '%prefix% &cCan''t find that player.'
  kb-test-success: '%prefix% &aKnockback test done on %player%.'
  jday-no-pending-bans: '%prefix% &cNobody is on the Judgement Day list.'
  jday-added-to-list: '%prefix% &c%player% &7is on the list.'
  reset-command: '%prefix% &7Violations for everyone online were reset.'
  disable-check-command-syntax: '%prefix% &cUsage: /vulcan disablecheck (check name), case sensitive.'
  invalid-check: '%prefix% &cNot a check. Examples: AimA, BadPacketsF, AutoClickerJ.'
  removed-check: '%prefix% &cDisabled %check%.'
  disabled-check: '%prefix% &cDisabled %check%.'
  violations-command-syntax: '%prefix% &cUsage: /vulcan violations (player)'
  no-logs: '%prefix% &cNo logs for this player.'
  cps-command-syntax: '%prefix% &cUsage: /vulcan cps (player)'
  connection-command-syntax: '%prefix% &cUsage: /vulcan connection (player)'
  logs-command-syntax: '%prefix% &cUsage: /logs (player) (page)'
  no-logs-file: '%prefix% &cThere''s no logs file.'
  logs-command-no-logs: '%prefix% &cNo logs found for %player%.'
  no-page: '%prefix% &cThere''s no page %page% for %player%.'
  update-available: '%prefix% &7There''s an update (&cv%new-version%&7).'
  latest-version: '%prefix% &aUp to date.'
  injection-failure: 'You joined too fast, try again.'
  frozen: '&cYou''re frozen. Wait for staff.'
  logged-out-while-frozen: '%prefix% &c%player% left while frozen.'
  froze: '%prefix% &7Froze &a%player%&7.'
  unfroze: '%prefix% &7Unfroze &c%player%&7.'
  freeze-command-syntax: '%prefix% &cUsage: /vulcan freeze (player)'
  shuffle-command-syntax: '%prefix% &cUsage: /vulcan shuffle (player)'
  shuffled-hotbar: '%prefix% &aShuffled %player%''s hotbar.'
  rotate-command-syntax: '%prefix% &cUsage: /vulcan rotate (player)'
  randomly-rotated: '%prefix% &aRotated %player%.'
  reset-command-syntax: '%prefix% &cUsage: /vulcan reset (player)'
  violations-reset: '%prefix% &aReset violations for %player%.'
  unknown-command: '%prefix% &cUnknown command.'
  unfroze-staff-broadcast: '%prefix% &c%player% &7was unfrozen by &c%staff%&7.'
  froze-staff-broadcast: '%prefix% &c%player% &7was frozen by &c%staff%&7.'
  removed-from-jday: '%prefix% &aTook %player% off Judgement Day.'
  jday-remove-syntax: '%prefix% &cUsage: /jday remove (player)'
  punishlogs-syntax: '%prefix% &cUsage: /punishlogs (player)'
