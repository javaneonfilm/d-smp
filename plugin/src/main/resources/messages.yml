access:
  no-game: "<#FF2B2B><b>CartZone</b>\n\n<white>No game right now.\n<gray>Next one gets posted on our Discord."
  next-game: "<#FF2B2B><b>CartZone</b>\n\n<white>Next game is #<id> at <yellow><start></yellow>.\n<gray>You can join <minutes> minutes before it starts."
  in-progress: "<#FF2B2B><b>CartZone</b>\n\n<white>Game #<id> already started.\n<gray>Check Discord for the next one."

lobby:
  welcome: '<prefix><gray>Hey <white><player></white>, welcome back.'
  window-open: '<prefix><white>Game #<id> starts at <yellow><start></yellow>, stay online to get in.'

chat:
