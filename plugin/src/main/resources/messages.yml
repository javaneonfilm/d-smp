# CartRoyale messages. MiniMessage format (https://docs.advntr.dev/minimessage/format.html).
# Placeholders look like <name>. <prefix> inserts the prefix below.
# The discord.* entries are plain Discord markdown, not MiniMessage.

prefix: '<#FF0000><b>CartRoyale</b> <gray>»</gray> '

# ------------------------------------------------------------------ Discord (HOOK-1..4)
discord:
  title: 'Game #<id> (<region>)'
  hosted: |-
    To be notified for games hosted, please go to <id:customize>

    **Game Settings**
    - Map: **<map>**
    - Team Size: **<team_size>**
    - Duration: **<duration> minutes**
    - Purge Cap: **<cap>**
    - Mode: **<mode>**
    - Modifiers: <modifiers>

    **Info**
    - Starting: <t:<start_unix>:R>
    - Server IP: `<ip>`
  hosted-by: 'Hosted by <hoster>'
  random-map: 'Random'
  no-modifiers: 'None'
  warning-title: '5 minute warning!'
  warning: |-
    The game starts <t:<start_unix>:R>. Log in now.
    - Server IP: `<ip>`
  purge-title: 'Purge is starting!'
  purge: |-
    Players are being selected into the game.
    - Players Online: **<online>**
  results-title: 'Game #<id> Results'
  results: |-
    - Winner(s): <winners> (**<winner_kills> Kills**)
    - MVP: `<mvp>` (**<mvp_kills> Kills**)
  results-none: |-
    - Nobody survived.
    - MVP: `<mvp>` (**<mvp_kills> Kills**)
  daily-title: "Today's games (<date>)"
  daily-line: '**Game <n>:** <t:<start_unix>:t> *<team_size>* <emoji>'
  daily-footer: 'Server IP: <ip>'

team-size:
  '1': 'Solos'
  '2': 'Duos'
  '3': 'Trios'
  '4': 'Squads'

modes:
  lt:
    name: 'LT Cart'
  ht:
    name: 'HT Cart'

modifiers:
  no_fall_damage:
    name: 'No Fall Damage'
    desc: 'Nobody takes fall damage.'
  luckier_loot:
    name: 'Luckier Loot'
    desc: 'Rare, epic and legendary loot shows up more.'
  pearls:
    name: 'Pearls'
    desc: 'Ender pearls can be found in chests.'

categories:
  kill: 'Kill Effects'
  explosion: 'Cart Explosion Effects'
  suffix: 'Suffixes'

# ------------------------------------------------------------------ access / lobby
access:
  no-game: "<#FF0000><b>CartRoyale</b>\n\n<white>No game is being hosted right now.\n<gray>See our Discord for the next one."
  next-game: "<#FF0000><b>CartRoyale</b>\n\n<white>Game #<id> starts at <yellow><start></yellow>.\n<gray>Logins open <minutes> minutes before the start. See you there."
  in-progress: "<#FF0000><b>CartRoyale</b>\n\n<white>Game #<id> is already running.\n<gray>Watch Discord for the next one."

lobby:
  welcome: '<prefix><white>Welcome, <yellow><player></yellow>. Last cart standing wins.'
  window-open: '<prefix><white>Game #<id> starts at <yellow><start></yellow>. Stay online to be selected.'

chat:
  format: '<tag><name><suffix><dark_gray>:</dark_gray> <white><message>'
  spectator-format: '<dark_gray>[Spectator]</dark_gray> <gray><name><dark_gray>:</dark_gray> <gray><message>'

ranks:
  vip-tag: '<#7DDC6A>[VIP]</#7DDC6A>'
  vipplus-tag: '<#FFD700>[VIP+]</#FFD700>'
  admin-tag: '<#FF0000>[Staff]</#FF0000>'

ip-bar:
  plain: '<#FF0000><b>CartRoyale</b></#FF0000> <gray>|</gray> <white><ip>'
  # With the resource pack: the minecart glyph from the pack's font, then the IP.
  styled: "<font:cartroyale:hud><white>\uE000</white></font> <white><ip>"

tab:
  header: "\n<#FF0000><b>CARTROYALE</b></#FF0000>\n<gray><ip>\n"
  footer: "\n<gray>Online: <white><online></white>   <gray><state>\n<dark_gray>Last cart standing wins.\n"

sidebar:
