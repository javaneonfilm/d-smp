    - '<gray>Online: <white><online>'
    - ''
    - '<gray>Next game:'
    - ' <white><next>'
    - ' <gray><next_rel>'
    - ''
    - '<#FF0000><ip>'
  match:
    - '<dark_gray>----------------'
    - '<gray>Game: <white><game>'
    - '<gray>Phase: <white><phase>'
    - '<gray>Alive: <white><alive>'
    - ''
    - '<#FF0000><ip>'

states:
  none: 'No game queued'
  none-short: 'none'
  next: 'Next: #<id> at <time> (<rel>)'
  join_open: 'Game #<id>: join window open'
  countdown: 'Game #<id>: starting'
  purge: 'Game #<id>: purge'
  teaming: 'Game #<id>: teaming up'
  boarding: 'Game #<id>: boarding'
  deploy: 'Game #<id>: dropping in (<alive> alive)'
  playing: 'Game #<id>: <alive> alive'
  ending: 'Game #<id>: over'
  resetting: 'Game #<id>: resetting'
  idle: 'Idle'
  announced: 'Queued'

