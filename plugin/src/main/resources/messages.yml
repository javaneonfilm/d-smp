# CartZone messages. MiniMessage format (https://docs.advntr.dev/minimessage/format.html).
# Placeholders look like <name>. <prefix> inserts the prefix below.
# The discord.* entries are plain Discord markdown, not MiniMessage.
#
# When a plugin update raises messages-version, this file is replaced and your old one is kept
# as messages-old-<n>.yml, so copy your edits back over from there.
messages-version: 2

prefix: '<#FF2B2B><b>CartZone</b> <dark_gray>|</dark_gray> '

# ------------------------------------------------------------------ Discord
discord:
  title: 'Game #<id> (<region>)'
  hosted: |-
    Get pinged for games in <id:customize>

    **Settings**
    - Map: **<map>**
    - Team size: **<team_size>**
    - Length: **<duration> min**
    - Player cap: **<cap>**
    - Mode: **<mode>**
    - Modifiers: <modifiers>

    Starts <t:<start_unix>:R> on `<ip>`
  hosted-by: 'Hosted by <hoster>'
  random-map: 'Random'
  no-modifiers: 'None'
  warning-title: 'Starting in 5 minutes'
  warning: |-
    Game starts <t:<start_unix>:R>, hop on now.
    `<ip>`
  purge-title: 'Purge is happening'
  purge: |-
    Picking who gets in.
    Online: **<online>**
  results-title: 'Game #<id> results'
  results: |-
    Winner: <winners> (**<winner_kills>** kills)
    MVP: `<mvp>` (**<mvp_kills>** kills)
  results-none: |-
    Nobody made it out.
    MVP: `<mvp>` (**<mvp_kills>** kills)
  daily-title: "Today's games (<date>)"
  daily-line: '**Game <n>:** <t:<start_unix>:t> *<team_size>* <emoji>'
  daily-footer: '<ip>'

team-size:
  '1': 'Solos'
  '2': 'Duos'
  '3': 'Trios'
  '4': 'Squads'

modes:
  lt:
    name: 'LT Cart'
  ht:
    name: 'HT Cart'

modifiers:
  no_fall_damage:
    name: 'No Fall Damage'
    desc: 'No fall damage for anyone.'
  luckier_loot:
    name: 'Luckier Loot'
    desc: 'Better stuff in chests.'
  pearls:
    name: 'Pearls'
    desc: 'Ender pearls show up in chests.'

categories:
  kill: 'Kill Effects'
  explosion: 'Cart Explosions'
  suffix: 'Suffixes'

