# d-smp.vip messages (the CartZone plugin). MiniMessage format (https://docs.advntr.dev/minimessage/format.html).
# Placeholders look like <name>. <prefix> inserts the prefix below.
# The discord.* entries are plain Discord markdown, not MiniMessage.
#
# When a plugin update raises messages-version, this file is replaced and your old one is kept
# as messages-old-<n>.yml, so copy your edits back over from there.
messages-version: 14

prefix: '<accent>●</accent> '

# ------------------------------------------------------------------ Discord
discord:
  title: 'Game #<id> (<region>)'
  hosted: |-
    Get pinged for games in <id:customize>

    **Settings**
    - Map: **<map>**
    - Team size: **<team_size>**
    - Length: **<duration> min**
    - Player cap: **<cap>**
    - Modifiers: <modifiers>

    Starts <t:<start_unix>:R> on `<ip>`
  hosted-by: 'Hosted by <hoster>'
  random-map: 'Random'
  no-modifiers: 'None'
  warning-title: 'Starting in 5 minutes'
  warning: |-
    Game starts <t:<start_unix>:R>, hop on now.
    `<ip>`
  purge-title: 'Purge is happening'
  purge: |-
    Picking who gets in.
    Online: **<online>**
  results-title: 'Game #<id> results'
  results: |-
    Winner: <winners> (**<winner_kills>** kills)
    MVP: `<mvp>` (**<mvp_kills>** kills)
  results-none: |-
    Nobody made it out.
    MVP: `<mvp>` (**<mvp_kills>** kills)
  daily-title: "Today's games (<date>)"
  daily-line: '**Game <n>:** <t:<start_unix>:t> *<team_size>* <emoji>'
  daily-footer: '<ip>'

team-size:
  '1': 'Solos'
  '2': 'Duos'
  '3': 'Trios'
  '4': 'Squads'

modes:
  lt:
    name: 'Standard'
  ht:
    name: 'Standard'

modifiers:
  no_fall_damage:
    name: 'No Fall Damage'
    desc: 'No fall damage for anyone.'
  luckier_loot:
    name: 'Luckier Loot'
    desc: 'Better stuff in chests.'
  pearls:
    name: 'Pearls'
    desc: 'Ender pearls show up in chests.'

categories:
  kill: 'Kill Effects'
  explosion: 'Explosions'
  suffix: 'Suffixes'

# ------------------------------------------------------------------ joining / lobby
access:
  no-game: "<accent><b><sc>d-smp.vip</sc></b>

<fg>No game right now.
<sub>The next one gets posted on our Discord."
  next-game: "<accent><b><sc>d-smp.vip</sc></b>

<fg>Next game is #<id> at <hl><start></hl>.
<sub>You can join <minutes> minutes before it starts."
  in-progress: "<accent><b><sc>d-smp.vip</sc></b>

<fg>Game #<id> already started.
<sub>Check Discord for the next one."

lobby:
  welcome: '<prefix><sub>Hey <fg><player></fg>, welcome back.'
  window-open: '<prefix><fg>Game #<id> starts at <hl><start></hl>, stay online to get in.'

chat:
  format: '<tag><name><suffix> <dim>›</dim> <fg><message>'
  spectator-format: '<dim><sc>spec</sc></dim> <sub><name> <dim>›</dim> <sub><message>'

ip-bar:
  plain: '<accent><b><sc><ip></sc></b></accent>'
  styled: '<fg><sc><ip></sc>'

tab:
