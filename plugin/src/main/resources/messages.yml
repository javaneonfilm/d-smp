    - ' <sub><sc>online</sc><tab><fg><online> '
    - ''
    - ' <sub><sc>wins</sc><tab><fg><wins> '
    - ' <sub><sc>kills</sc><tab><fg><kills> '
    - ' <sub><sc>coins</sc><tab><coin><coins> '
    - ''
    - ' <sub><sc>next game'
    - ' <fg><next><tab><dim><next_rel> '
    - ''
    - ' <accent><sc><ip>'
  game:
