# Copy the values you need into secrets.yml (same folder). Never share secrets.yml,
# never paste its contents in chat, never commit it to git.

# Discord: channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL
discord-webhook-url: 'https://discord.com/api/webhooks/000000000000000000/REPLACE_ME'

# The random token the Cloudflare Worker checks (same value as the Worker's TOKEN secret).
# The plugin makes one in secrets.yml by itself on the first start.
stats-token: 'REPLACE_ME'
