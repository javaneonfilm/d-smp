# CartZone - main config. Reload with /cart reload (worlds and the database need a restart).
# Secrets (Discord webhook URL, stats token) do NOT go here. They live in secrets.yml.

server-ip: d-smp.vip
# Shown in the webhook title, e.g. "Game #12 (EU)". It is the server's region, not the domain.
region: EU
# Wall-clock times: schedule, Host GUI times, daily shop reset. Any Java zone id (UTC, Europe/Berlin...).
timezone: Europe/Berlin

worlds:
  lobby: lobby        # the server's main world (level-name in server.properties)
  arena: arena        # loaded by the plugin and restored from its map template on every boot
  default-map: ''     # template to boot with when no game names one (empty = first template)

lobby:
  spawn: ''           # set in game with /cart setlobby

join:
  window-minutes: 5         # players can log in this long before a game starts (D4)
  countdown-seconds: 10     # title countdown at the end of the window
  min-players: 2            # fewer eligible players at the purge cancels the game
  start-command-seconds: 60 # /cart start opens the window this far ahead (/cart start now: countdown only)
  missed-grace-minutes: 10  # a game whose start passed longer ago than this (server down) is marked missed

purge:
  action: KICK              # KICK or SPECTATE
  weights:
    default: 1.0            # everyone without a weight permission
  # Permission -> purge weight. A player gets the LOWEST weight among the nodes they have; lower =
  # much less likely to be purged. Add your own nodes and give them to LuckPerms groups.
  # cartzone.perk.purge-immune makes a player immune outright.
  weight-perms:
    cartzone.perk.purge-low: 0.15
  hoster-immune: true

teams:
  phase-seconds: 90
  sizes: [1, 2, 4]          # Solos, Duos, Squads

host:
  default-cap: 100
  defaults:
    mode: LT
    squad: 1
    modifiers: []
  limits:
    min-cap: 10
    max-cap: 120            # ticket holders
    admin-max-cap: 200
    min-minutes: 20         # match length a hoster can pick; the zone timings in zone.yml are stretched to fit
    max-minutes: 40
  min-lead-minutes: 10      # ticket holders pick a start at least this far ahead
  slot-minutes: 30          # two games never start closer than this
  ticket-hours: 6           # length of the temporary LuckPerms host group
  host-group: host
  revoke-cancels-game: true # a chargeback cancels the game the ticket paid for
  store-url: ''             # where to buy Game Tickets; empty = no link

schedule:
  create-ahead-minutes: 60  # scheduled games are created (and announced) this far ahead
  hoster-name: Diamond SMP

deploy:
  distance: 300             # blocks the ghasts fly before dropping everyone
  speed: 0.6                # blocks per tick (12 blocks/s)
  riders-per-ghast: 4
  spacing: 9
  row-gap: 12
  per-row: 8
  harness: false            # riders without a harness can't steer the ghast
  move-mode: TELEPORT       # TELEPORT (tested on 1.21.11) or VELOCITY; Happy Ghasts ignore velocity while NoAI
  planned-seconds: 60       # added to the zone time for the "Duration" in Discord
  solo-board-delay-seconds: 5  # solo games: pause after the purge so the route loads
  ghasts-per-tick: 2         # boarding is spread over ticks so 120 players never freeze the server

elytra:
  max-glide-seconds: 60
  allow-fireworks: false

match:
  grace-seconds: 120        # after everyone lands: no PvP (explosions included) and the zone holds still
  max-totems: 1             # Totems of Undying a player can carry in a game (offhand included)
  zone-close-minutes: 20    # then the zone is fully closed this long later (unless the host picks 20-40)
  hard-timeout-extra-minutes: 5
  end-kick-seconds: 10
  restart-after: true       # END-5: shut down once after a game; the host restarts the server
  kill-credit-seconds: 15   # a death within this long of a player's hit counts as their kill
  pvp-during-deploy: false

chests:                     # amount, spacing and tier mix moved to loot.yml (/cart loot -> Chest settings)
  hologram-height: 1.35
  random-armor-durability: true   # armor in chests comes worn: 10-100% left, usually low
  place-per-tick: 20
  scan-chunks-per-tick: 8

# Loot upgrade books (they apply themselves when picked up in the arena) and kill rewards.
books:
  sharpness-max: 5          # highest Sharpness a Sharpness Book can reach
  quickcharge-max: 3        # Quick Charge above 3 makes crossbows unusable in vanilla
  protection-max: 5         # Protection Books and kills raise worn armor up to this (none > I > ... > V)
upgrades:
  repair-on-kill: true      # a kill repairs your armor with what was left of the victim's, slot by slot
  armor-on-kill: true       # a kill gives the killer's worn armor +1 Protection (up to books.protection-max)

sounds:
  kill: cartzone:kill       # played to the killer (from the resource pack); '' turns it off
  kill-volume: 1.0

shield:
  item-model: cartzone:one_time_shield

economy:
  coins-per-kill: 5
  shop-per-category: 2
  shop-salt: 0
  shop-odds:
    COMMON: 60
    RARE: 28
    EPIC: 10
    LEGENDARY: 2

cosmetics:
  max-particles-per-step: 120
  max-particles-per-tick: 200

ranks:
  wind-charges: 16          # lobby wind charges for cartzone.perk.lobby-wind

# Rank badges and name colours, shown in chat, the tab list and above the head (and in the TAB
# plugin through %cartzone_tag% / %cartzone_namecolor%). The FIRST entry whose permission a player
# has wins, so the highest rank goes on top. The badges are pictures from the resource pack:
#  VIP,  VIP+,  HOST,  MOD,  ADMIN,  MEDIA,  CREATOR. A tag can also be plain text,
# e.g. tag: '<gold>[MVP]'. To use one, give a LuckPerms group the permission.
rank-tags:
  - {id: admin, permission: cartzone.tag.admin, tag: "", name-color: '#FF3333'}
  - {id: mod, permission: cartzone.tag.mod, tag: "", name-color: '#2E9BFF'}
  - {id: host, permission: cartzone.tag.host, tag: "", name-color: '#33CC33'}
  - {id: creator, permission: cartzone.tag.creator, tag: "", name-color: '#A23CF9'}
  - {id: media, permission: cartzone.tag.media, tag: "", name-color: '#FFAA33'}
  - {id: vipplus, permission: cartzone.tag.vipplus, tag: "", name-color: '#E01B1B'}
  - {id: vip, permission: cartzone.tag.vip, tag: "", name-color: '#FF6B6B'}

# auto = if the TAB plugin is installed, TAB draws the tab list, header and nametags (see
# plugins/TAB in the upload folder); on/off force it.
tab-plugin: auto

lobby-items:
  grapple:
    slot: 0
    cooldown-ms: 500
    pull-range: 50          # max distance to the bobber, blocks
    pull-base: 0.5          # speed = base + per-block x distance (blocks/tick), capped; carries you ~5 blocks past the bobber
    pull-per-block: 0.11
    pull-lift: 0.7          # extra upward kick
    pull-max-velocity: 5.0
  team:
    slot: 2
  host:
    slot: 7
  cosmetics:
    slot: 4
  stats:
    enabled: true
    slot: 8

# Squad cards in the top-left corner during team games (head, name, kills, health). Needs the
# resource pack; players without it see their squad on the sidebar.
squad-hud:
  enabled: true

# Vulcan / AntiGamingChair: don't flag what CartZone does to players on purpose.
anticheat:
  # Ignore all flags in the lobby (elytra perk, grapple, wind charges, void rescue).
  exempt-lobby: true
  # Ignore flags this long after the plugin launches someone (grapple pull).
  launch-exempt-ms: 4000

webhooks:
  enabled: true
  username: Diamond SMP
  events-role-id: ''        # right-click the @Events role with Developer Mode on, Copy Role ID
  flag: ''                  # optional text before the title; plain text, no emoji
  warning-minutes: 5
  daily-post:                # the "Today's games" list in Discord once a day
    send: false             # off: CartZone doesn't post the schedule
    time: '12:00'           # in the time zone above
    ping: false
    # Optional custom server emoji per team size, e.g. '<:head:123456789012345678>'
    emoji:
      '1': ''
      '2': ''
      '4': ''

stats:
  site-url: ''              # leaderboards page shown in /stats; empty = no link
  export:
    mode: 'OFF'             # WORKER (POST to url), FILE (plugins/CartZone/stats.json) or 'OFF' (keep the quotes)
    url: ''                 # the Cloudflare Worker endpoint, https only
    interval-seconds: 60

resource-pack:
  enabled: false
  url: ''                   # direct download link (mcpacks)
  sha1: ''                  # 40 hex characters, see docs/RESOURCEPACK.md
  required: true

ip-bar:
  enabled: true
  color: PINK               # the boss bar colour the resource pack re-skins; nothing else uses pink

sidebar:
  enabled: true

# Extra console lines for testing (shield blocks, resource pack status). Leave off on the live server.
debug: false
