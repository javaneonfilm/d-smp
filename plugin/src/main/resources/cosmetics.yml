    price: 220
    name: Switchman
    icon: NAME_TAG
    text: '<aqua>[Switchman]'
  - id: suffix_conductor
    category: suffix
    rarity: RARE
    price: 400
    name: Conductor
    icon: NAME_TAG
    text: '<blue>[Conductor]'
  - id: suffix_fuse_lit
    category: suffix
    rarity: EPIC
    price: 650
    name: Fuse Lit
    icon: NAME_TAG
    text: '<light_purple>[Fuse Lit]'
  - id: suffix_boom
    category: suffix
    rarity: EPIC
    price: 1000
    name: Boom
    icon: NAME_TAG
    text: '<#FF8A1F>[Boom]'
  - id: suffix_last_cart
    category: suffix
    rarity: LEGENDARY
