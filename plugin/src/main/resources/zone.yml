# The zone (D11). Each phase waits, then shrinks to its radius. Damage is in half-hearts
# (2 = one heart) every `interval` ticks (20 = 1 second) while outside.
# The start circle and final centre are set per map: /cart zone start <radius>, /cart zone final.
phases:
  - {wait: 180, shrink: 120, radius: 250, damage: 2, interval: 20}
  - {wait: 150, shrink: 100, radius: 160, damage: 2, interval: 20}
  - {wait: 120, shrink: 90, radius: 90, damage: 3, interval: 20}
  - {wait: 90, shrink: 75, radius: 40, damage: 4, interval: 20}
  - {wait: 60, shrink: 60, radius: 5, damage: 6, interval: 20}

# After the last phase the 5-block circle orbits on a ring of this radius at walking speed.
orbit:
  radius: 100
  speed: 4.3        # blocks per second

particles:
  view-distance: 40
  spacing: 2.0
  height: 10
  every-ticks: 4
  max-per-player: 180
