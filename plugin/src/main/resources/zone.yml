# The zone (D11). Each phase waits, then shrinks to its radius. Damage is in half-hearts
# (2 = one heart) every `interval` ticks (20 = 1 second) while outside.
# The start circle and final centre are set per map: /cart zone start <radius>, /cart zone final.
# The wait/shrink seconds below only set the proportions: every game stretches them so the zone is
# fully closed at the game's length (config.yml match.zone-close-minutes = 20, or the host's 20-40).
phases:
  - {wait: 180, shrink: 120, radius: 250, damage: 2, interval: 20}
  - {wait: 150, shrink: 100, radius: 160, damage: 2, interval: 20}
  - {wait: 120, shrink: 90, radius: 90, damage: 3, interval: 20}
  - {wait: 90, shrink: 75, radius: 40, damage: 4, interval: 20}
  - {wait: 60, shrink: 60, radius: 5, damage: 6, interval: 20}

# close-fully: the last circle shrinks to nothing (radius 0), so the zone is fully closed at the end.
# max-speed: no shrink is faster than this many blocks per second; the time comes out of the wait.
close-fully: true
# Zone damage = the phase's damage + damage-per-block for every block you are outside the circle,
# never more than max-damage per hit (half-hearts). It ignores armor, Protection and Resistance.
damage-per-block: 0.15
max-damage: 16
damage-ignores-absorption: true   # golden apple hearts don't soak zone damage
no-healing-outside: true          # outside the zone you can't heal (regen, apples, food)
max-speed: 1.5

# Only without close-fully: after the last phase the final circle orbits on a ring of this radius at walking speed.
orbit:
  radius: 100
  speed: 4.3        # blocks per second

particles:
  view-distance: 40
  spacing: 2.0
  height: 10
  every-ticks: 4
  max-per-player: 180

# The wall players see. 'shader' = the CartZone wall from the resource pack (players whose pack
# failed or was declined get the particles below instead); 'shader-all' = the wall for everyone,
# never particles (use this if players install the pack themselves); 'particles' = old particles.
# The pack counts as loaded when it comes from config.yml resource-pack or server.properties.
wall:
  mode: shader
  base-y: 0                 # the wall starts here and runs 330 blocks up (fades out ~60 above you)
  reanchor-distance: 48     # each player's wall entity follows them in jumps of this many blocks
  item-model: cartzone:zone_wall
