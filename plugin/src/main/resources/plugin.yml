name: CartZone
version: '${project.version}'
main: com.cartroyale.CartRoyale
api-version: '1.21.11'
author: Cuda
description: Minecart PvP battle royale - hosted games, purge, ghast drops, loot, zone, cosmetics.
softdepend: [LuckPerms, PlaceholderAPI, TAB, Vulcan]
load: POSTWORLD

commands:
  cart:
    description: CartZone commands.
    usage: /cart help
  team:
    description: Team up before a team game.
    usage: /team <invite|accept|leave|disband|list>
  teamchat:
    description: Chat with your team only. Without a message it toggles team chat on/off.
    usage: /teamchat [message]
    aliases: [tc]
  spectate:
    description: Pick a player to follow while spectating.
    usage: /spectate
  offence:
    description: Punish a player (mute/ban ladders from offences.yml).
    usage: /offence [player] [type] [reason]
    aliases: [offense]
    permission: cartzone.offence
  kitready:
    description: Clear your inventory to build a kit.
    usage: /kitready
    permission: cartzone.admin

permissions:
  # Build your own ranks: give a LuckPerms group the nodes it should have, e.g.
  #   /lp group mvp permission set cartzone.perk.purge-immune true
  #   /lp group mvp permission set cartzone.tag.mvp true   (and add that tag in config.yml)
  cartzone.admin:
    description: Full control of CartZone (commands, build mode, spectating, loot editor).
    default: op
    children:
      cartzone.host: true
      cartzone.tag.admin: true
      cartzone.offence: true
  cartzone.offence:
    description: /offence menu, chat filter alerts, not filtered. Give it to your mod group.
    default: op
  cartzone.host:
    description: Can open the Host GUI when holding a ticket.
    default: true
  cartzone.perk.purge-immune:
    description: Never purged when a game is over its player cap.
    default: false
  cartzone.perk.purge-low:
    description: Much less likely to be purged (weight in config.yml purge.weight-perms).
    default: false
  cartzone.perk.lobby-wind:
    description: Wind charges in the lobby (they only push the thrower).
    default: false
  cartzone.perk.lobby-elytra:
    description: An elytra in the lobby.
    default: false
  cartzone.tag.admin:
    description: ADMIN badge and red name (config.yml rank-tags).
    default: false
  cartzone.tag.mod:
    description: MOD badge and blue name.
    default: false
  cartzone.tag.host:
    description: HOST badge and green name (give it to the LuckPerms group tickets grant).
    default: false
  cartzone.tag.creator:
    description: CREATOR badge and purple name.
    default: false
  cartzone.tag.media:
    description: MEDIA badge and orange name.
    default: false
  cartzone.tag.vipplus:
    description: VIP+ badge and dark red name.
    default: false
  cartzone.tag.vip:
    description: VIP badge and light red name.
    default: false
  # Ready-made bundles, kept so existing groups keep working. You don't have to use them.
  cartzone.rank.vip:
    description: 'Bundle: purge-low, lobby-wind, VIP tag.'
    default: false
    children:
      cartzone.perk.purge-low: true
      cartzone.perk.lobby-wind: true
      cartzone.tag.vip: true
  # MEDIA gets the VIP perks, CREATOR the VIP+ perks, each with its own badge.
  cartzone.rank.media:
    description: 'Bundle: VIP perks (purge-low, lobby-wind) + MEDIA badge.'
    default: false
    children:
      cartzone.perk.purge-low: true
      cartzone.perk.lobby-wind: true
      cartzone.tag.media: true
  cartzone.rank.creator:
    description: 'Bundle: VIP+ perks (purge-immune, lobby-wind, lobby-elytra) + CREATOR badge.'
    default: false
    children:
      cartzone.perk.purge-immune: true
      cartzone.perk.lobby-wind: true
      cartzone.perk.lobby-elytra: true
      cartzone.tag.creator: true
  cartzone.rank.vipplus:
    description: 'Bundle: purge-immune, lobby-wind, lobby-elytra, VIP+ tag.'
    default: false
    children:
      cartzone.perk.purge-immune: true
      cartzone.perk.lobby-wind: true
      cartzone.perk.lobby-elytra: true
      cartzone.tag.vipplus: true
