# Loot chests (D8, LOOT-2..4). Edit in game with /cart loot, or here and /cart reload.
# An entry is `material: NAME`, `special: one_time_shield`, or `item: <serialized>` (written by the editor).
# min/max: the amount rolled for that slot. pearl: true marks entries the Pearls modifier controls
# (ender pearls are marked automatically).

# How many chests and how close together. Easiest to change in game: /cart loot -> Chest settings.
# Chests per game = base + per-player x players, capped at max. min-distance = blocks between chests.
chests:
  base: 200
  per-player: 3.0
  max: 600
  min-distance: 10
  tier-shares: [60, 30, 10]   # bronze / silver / gold, percent

# Items per chest.
slots:
  min: 4
  max: 9

rarity-weights:
  COMMON: 60
  RARE: 25
  EPIC: 12
  LEGENDARY: 3

# Luckier Loot multiplies these weights.
luckier-loot-multipliers:
  COMMON: 1
  RARE: 1.5
  EPIC: 2
  LEGENDARY: 3

tiers:
  # 1 star - Bronze
  1:
    - {material: RAIL, rarity: COMMON, min: 12, max: 46}
    - {material: BREAD, rarity: COMMON, min: 2, max: 8}
